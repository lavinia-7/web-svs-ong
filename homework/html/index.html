<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Ninja</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  
  <body>
    
    <header>
       <h3>Food Ninja</h3>
        <nav>
            <a href="article.html">Blog</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <h1 style="text-align: center; margin-top: 50px;">The Food Ninja Blog</h1>
    <h5 style="text-align: center; color:gray">A blog about food, experiences, and recipes.</h5>

    
    <div class="search-bar">
      <input type="text" placeholder="Search for articles">
      <button>🔍</button>
    </div>

    <div class="buttons">
      <div class="button">Travel</div> 
      <div class="button">Food Theory</div> 
      <div class="button">Recipes</div> 
      <div class="button">Restaurants</div> 
    </div>
    
    <div class="articles">
    </div>
    <script>
      async function fetchUserData() {
  try {
    const response = await fetch(`http://localhost:3000/articles`);
    const data = await response.json();
    data.forEach(article => {
      const articleElement = document.createElement('article');
      articleElement.innerHTML = `
        <img src="${article.image}">
        <div class="content">
          <span class="categ">${article.category}</span>
          <h2>${article.title}</h2>
          <p class="date">${article.date} · ${article.readTime} min read</p>
          <p class="description">${article.description}</p>
        </div>
      `;
      document.querySelector('.articles').appendChild(articleElement);
    });
    console.log(data);
  } catch (error) {
    console.error("Error fetching user data:", error);
  }
}

      fetchUserData();
    </script>
  </body>
</html>
