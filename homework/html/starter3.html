<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive News Homepage</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <style>
    .news-layout{
        display:flex;
        flex-direction: column;
        gap: 20px;
    }
    .featured{
        background-color: #3B82F6;
        flex: 3;
    }
    .featured p{
        max-width: 300px;
    }
    .featured h1{
        font-size: 42px;
    }
    .news-1{
        background-color: #10B981;
    }
    .news-2{
        background-color: #8B5CF6;
    }
    .news-3{
        background-color: #F59E0B;
    }
    article{
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        gap: 20px;
    }
    .sidebar{
        display: flex;
        flex-direction: column;
        gap: 20px;
        flex: 2;
    }
    i{
        font-size: 60px;
        color: white;
        margin-bottom: 20px;
    }
    article{
        color: white;
    }
    h1,h2,p{
        text-align: center;
    }
   
    @media (min-width:768px){
.news-layout{
    flex-direction: row;
}
article{
    flex-direction: row;
}
.featured{
    display: flex;
    flex: 2;
    flex-direction: column;
    align-items: flex-start;
    
}
.featured i{
    margin-top: 60px;
    font-size: 100px;
    margin-bottom: 5px;
    align-self: flex-start;
    margin-left:40px;

}
.featured div{
    width: 100%;
    text-align: left;
}
.featured h1,
.featured p{
    text-align: left;
}
.sidebar{
    flex: 1;
}
h2,p{
    text-align: left;
}
}
    </style>
  </head>
  <body>
    <div class="news-layout">
      <article class="featured">
        <i class="fa-regular fa-newspaper"></i>
        <div>
        <h1>Featured Story</h1>
        <p>
          This is today's main headline. It should receive the most attention
          and therefore occupy more space on larger screens.
        </p>
    </div>
      </article>

      <aside class="sidebar">
        <article class="news-card news-1">
          <i class="fa-solid fa-earth-europe"></i>
        <div>
          <h2>World News</h2>
          <p>Global events shaping today's headlines.</p>
        </div>
        </article>


        <article class="news-card news-2">
          <i class="fa-solid fa-laptop-code"></i>
          <div>
          <h2>Technology</h2>
          <p>Latest updates from the tech industry.</p>
        </div>
        </article>

        <article class="news-card news-3">
          <i class="fa-regular fa-futbol"></i>
        <div>
          <h2>Sports</h2>
          <p>Highlights from today's biggest matches.</p>
        </div>
        </article>
      </aside>
    </div>
  </body>
</html>
